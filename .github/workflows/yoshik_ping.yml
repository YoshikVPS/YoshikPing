name: "🚀 سامانه مدیریت و پایش یوشیک پینگ (v2.0)"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  # ========================================================
  # ۱. پردازش پایش عمیق چندپورتی شبکه (/ping)
  # ========================================================
  run-deep-ping:
    name: "🔍 اجرای پایش عمیق شبکه"
    if: github.event.issue != null && startsWith(github.event.comment.body, '/ping')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 اعتبارسنجی دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then
            echo "❌ خطا: کاربر مجاز نیست."
            exit 1
          fi

      - name: "💬 ارسال پاسخ اولیه به مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 دستور شما دریافت شد مدیر گرامی؛ موتور پایش عمیق نسخه 2.0 از خارج کشور آغاز گردید... ⏳🔬"
            });

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4

      - name: "🐍 پیکربندی محیط پایتون"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 نصب پیش‌نیازها"
        run: |
          pip install jdatetime

      - name: "⚙️ پردازش دستور و اجرای پایش"
        run: |
          python yoshik_ping.py "${{ github.event.comment.body }}"

      - name: "💾 ذخیره و کامیت لاگ در مخزن"
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p ping
          git add ping/
          git commit -m "📝 ثبت لاگ تحلیلی شبکه v2.0: ${LOG_FILENAME:-update} [skip ci]" || echo "بدون تغییر"
          git push

      - name: "📢 ارسال داشبورد تحلیلی در ایشو"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('summary_comment.md')) {
              const body = fs.readFileSync('summary_comment.md', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ========================================================
  # ۲. پاکسازی دو مرحله‌ای پوشه لاگ‌ها (پاکسازی)
  # ========================================================
  cleanup-storage:
    name: "🧹 پاکسازی آرشیو پوشه لاگ‌ها"
    if: github.event.issue != null && contains(github.event.comment.body, 'پاکسازی')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "📥 دریافت سورس مخزن"
        uses: actions/checkout@v4

      - name: "💬 تاییدیه پاکسازی از مدیر"
        id: prompt_step
        uses: actions/github-script@v7
        with:
          script: |
            const promptComment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ آیا مطمئن هستید که تمام آرشیو پوشه `ping/` حذف شود؟ ظرف ۱ دقیقه با **«بله»** یا **«خیر»** پاسخ دهید."
            });
            const startTime = Date.now();
            let decision = "TIMEOUT";
            while (Date.now() - startTime < 60000) {
              await new Promise(r => setTimeout(r, 4000));
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                since: new Date(startTime).toISOString()
              });
              for (const c of comments.data) {
                if (c.user.login === context.actor && c.id !== promptComment.data.id) {
                  const t = c.body.trim();
                  if (t === "بله") { decision = "YES"; break; }
                  else if (t === "خیر") { decision = "NO"; break; }
                }
              }
              if (decision !== "TIMEOUT") break;
            }
            core.setOutput("decision", decision);

      - name: "⚙️ پردازش تصمیم مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            const decision = "${{ steps.prompt_step.outputs.decision }}";
            let reply = (decision === "YES") ? "✅ پوشه `ping/` با موفقیت پاکسازی شد." : (decision === "NO" ? "🙏 عملیات لغو شد." : "⏰ مهلت به پایان رسید؛ عملیات متوقف شد.");
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: reply });

      - name: "🗑 اعمال حذف فیزیکی پوشه"
        if: steps.prompt_step.outputs.decision == 'YES'
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -rf ping/
          git add -A
          git commit -m "🧹 پاکسازی پوشه ping توسط مدیر [skip ci]" || echo "پوشه‌ای نبود"
          git push
