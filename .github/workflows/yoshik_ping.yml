name: "🚀 موتور پردازش یوشیک پینگ (v1.0)"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  run-ping-test:
    name: "🔍 اجرای پایش و اسکن شبکه"
    # اجرای اکشنز مشروط به: شروع با /ping و فقط ارسال توسط کاربر مدیر تعیین شده در Secret
    if: |
      startsWith(github.event.comment.body, '/ping') &&
      github.event.comment.user.login == secrets.ADMIN_USERNAME
    runs-on: ubuntu-latest

    steps:
      - name: "💬 ارسال پاسخ اولیه به مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 دستور شما دریافت شد مدیر گرامی؛ آزمون شبکه آغاز گردید، لطفاً صبور باشید... ⏳🔬"
            });

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4

      - name: "🐍 پیکربندی محیط پایتون"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 نصب پکیج‌های پیش‌نیاز"
        run: |
          python -m pip install --upgrade pip
          pip install jdatetime

      - name: "⚙️ پردازش دستور و پایش شبکه"
        run: |
          python yoshik_ping.py "${{ github.event.comment.body }}"

      - name: "💾 ثبت و آرشیو لاگ در مخزن"
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p ping
          git add ping/
          git commit -m "📝 لاگ ارزیابی خودکار شبکه: ${LOG_FILENAME:-update} [skip ci]" || echo "تغییری وجود ندارد"
          git push

      - name: "📢 ارسال نتیجه نهایی در ایشو"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('summary_comment.md')) {
              const body = fs.readFileSync('summary_comment.md', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
