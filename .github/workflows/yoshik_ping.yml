name: "🚀 سامانه مدیریت و پایش یوشیک پینگ (v3.0)"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  # ========================================================
  # ۱. پردازش پایش عمیق چندپورتی شبکه (/ping)
  # ========================================================
  run-deep-ping:
    name: "🔍 اجرای پایش عمیق شبکه"
    if: github.event.issue != null && startsWith(github.event.comment.body, '/ping')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 اعتبارسنجی دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then
            echo "❌ خطا: کاربر مجاز نیست."
            exit 1
          fi

      - name: "💬 ارسال پاسخ اولیه به مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 دستور شما دریافت شد مدیر گرامی؛ موتور پایش عمیق Yoshik Ping v3.0 از خارج کشور آغاز گردید... ⏳🔬"
            });

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4

      - name: "🐍 پیکربندی محیط پایتون"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 نصب پیش‌نیازها"
        run: |
          pip install jdatetime

      - name: "⚙️ پردازش دستور و اجرای پایش"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python yoshik_ping.py "${{ github.event.comment.body }}"

      - name: "💾 ذخیره و کامیت لاگ در مخزن"
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p ping
          git add ping/
          git commit -m "📝 ثبت لاگ تحلیلی شبکه v3.0: ${LOG_FILENAME:-update} [skip ci]" || echo "بدون تغییر"
          git push

      - name: "📢 ارسال داشبورد تحلیلی در ایشو"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('summary_comment.md')) {
              const body = fs.readFileSync('summary_comment.md', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ========================================================
  # ۲. موتور هوشمند بایگانی و نسخه جدید (بایگانی)
  # ========================================================
  archive-release:
    name: "📦 مدیریت بایگانی و ساخت Release"
    if: github.event.issue != null && startsWith(github.event.comment.body, 'بایگانی')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 اعتبارسنجی تغییرات نسبت به آخرین بایگانی"
        id: check_changes
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const releaseSha = latestRelease.data.target_commitish;
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'main'
              });
              
              if (commit.sha === releaseSha) {
                core.setOutput("is_duplicate", "true");
                core.setOutput("release_url", latestRelease.data.html_url);
                return;
              }
            } catch (err) {}
            core.setOutput("is_duplicate", "false");

      - name: "⚠️ گزارش عدم وجود تغییر به مدیر"
        if: steps.check_changes.outputs.is_duplicate == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ **فرآیند بایگانی متوقف شد!**\nسورس‌کدهای پروژه نسبت به آخرین نسخه ذخیره‌شده تغییری نکرده‌اند. آخرین بایگانی همچنان معتبر است:\n🔗 [مشاهده آخرین بایگانی در Releases](${{ steps.check_changes.outputs.release_url }})"
            });

      - name: "📦 فشرده‌سازی سورس و ساخت Release"
        if: steps.check_changes.outputs.is_duplicate != 'true'
        id: create_rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v3.0-$(date +'%Y%m%d-%H%M%S')"
          zip -r "YoshikPing-Source.zip" yoshik_ping.py .github/ README.md
          gh release create "$TAG_NAME" "YoshikPing-Source.zip" --title "بایگانی خودکار نسخه ۳.۰ ($TAG_NAME)" --notes "📦 بایگانی سورس پروژه و موتور پایش یوشیک پینگ نسخه ۳.۰"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "rel_url=https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME" >> $GITHUB_OUTPUT

      - name: "📢 اطلاع‌رسانی انتشار در کانال تلگرام"
        if: steps.check_changes.outputs.is_duplicate != 'true' && contains(github.event.comment.body, '@YoshikVPSBOT')
        id: tg_announce
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          REL_URL: ${{ steps.create_rel.outputs.rel_url }}
          TAG_NAME: ${{ steps.create_rel.outputs.tag_name }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            TEXT="🚀 *انتشار رسمی سورس سامانه Yoshik Ping v3.0*%0A%0A📦 تگ بایگانی: \`$TAG_NAME\`%0A🛠 سورس اختصاصی پروژه به همراه معماری GitHub Actions بسته‌بندی شد.%0A%0A🔗 [دریافت مستقیم فایل سورس از گیت‌هاب]($REL_URL)%0A📢 کانال تخصصی: @YoshikVPS"
            RESP=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d "chat_id=$TELEGRAM_CHANNEL_ID&text=$TEXT&parse_mode=Markdown&disable_web_page_preview=true")
            MSG_ID=$(echo $RESP | jq -r '.result.message_id // empty')
            if [ -n "$MSG_ID" ]; then
              CLEAN_CH=$(echo "$TELEGRAM_CHANNEL_ID" | sed 's/@//')
              echo "tg_link=https://t.me/$CLEAN_CH/$MSG_ID" >> $GITHUB_OUTPUT
            fi
          fi

      - name: "💬 گزارش تکمیل بایگانی در ایشو"
        if: steps.check_changes.outputs.is_duplicate != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const relUrl = "${{ steps.create_rel.outputs.rel_url }}";
            const tgLink = "${{ steps.tg_announce.outputs.tg_link }}";
            let msg = `✅ **سورس نسخه جدید با موفقیت بایگانی شد.**\n\n📦 **لینک نسخه ریلیز:** [مشاهده و دانلود ZIP در Releases](${relUrl})\n`;
            if (tgLink) {
              msg += `📢 **لینک پست کانال:** [مشاهده اطلاعیه انتشار در تلگرام](${tgLink})\n`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg
            });

  # ========================================================
  # ۳. پاکسازی سوابق و تاریخچه تب Actions (اکشنز-پاک)
  # ========================================================
  cleanup-actions-history:
    name: "🧹 پاکسازی تاریخچه اجراهای اکشنز"
    if: github.event.issue != null && contains(github.event.comment.body, 'اکشنز-پاک')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "🗑 حذف تمامی سوابق اجراهای قبلی و پاکسازی"
        uses: actions/github-script@v7
        with:
          script: |
            const currentRunId = context.runId;
            let deletedCount = 0;
            
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const run of runs.data.workflow_runs) {
              if (run.id !== currentRunId) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                  deletedCount++;
                } catch (e) {
                  console.log(`خطا در حذف اجرای شماره ${run.id}: ${e.message}`);
                }
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🧹 **پاکسازی تب Actions انجام شد.**\nتعداد **${deletedCount}** اجرای قبلی با موفقیت حذف گردید و تاریخچه به طور کامل خلوت شد. ✅`
            });

            // حذف خودکار رکورد اجرای همین دستور تا ردپایی در تب Actions نماند
            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: currentRunId
              });
            } catch (e) {}

  # ========================================================
  # ۴. پاکسازی دو مرحله‌ای پوشه لاگ‌ها (پاکسازی)
  # ========================================================
  cleanup-storage:
    name: "🧹 پاکسازی آرشیو پوشه لاگ‌ها"
    if: github.event.issue != null && contains(github.event.comment.body, 'پاکسازی')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "📥 دریافت سورس مخزن"
        uses: actions/checkout@v4

      - name: "💬 تاییدیه پاکسازی از مدیر"
        id: prompt_step
        uses: actions/github-script@v7
        with:
          script: |
            const promptComment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ آیا مطمئن هستید که تمام آرشیو پوشه `ping/` حذف شود؟ ظرف ۱ دقیقه با **«بله»** یا **«خیر»** پاسخ دهید."
            });
            const startTime = Date.now();
            let decision = "TIMEOUT";
            while (Date.now() - startTime < 60000) {
              await new Promise(r => setTimeout(r, 4000));
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                since: new Date(startTime).toISOString()
              });
              for (const c of comments.data) {
                if (c.user.login === context.actor && c.id !== promptComment.data.id) {
                  const t = c.body.trim();
                  if (t === "بله") { decision = "YES"; break; }
                  else if (t === "خیر") { decision = "NO"; break; }
                }
              }
              if (decision !== "TIMEOUT") break;
            }
            core.setOutput("decision", decision);

      - name: "⚙️ پردازش تصمیم مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            const decision = "${{ steps.prompt_step.outputs.decision }}";
            let reply = (decision === "YES") ? "✅ پوشه `ping/` با موفقیت پاکسازی شد." : (decision === "NO" ? "🙏 عملیات لغو شد." : "⏰ مهلت به پایان رسید؛ عملیات متوقف شد.");
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: reply });

      - name: "🗑 اعمال حذف فیزیکی پوشه"
        if: steps.prompt_step.outputs.decision == 'YES'
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -rf ping/
          git add -A
          git commit -m "🧹 پاکسازی پوشه ping توسط مدیر [skip ci]" || echo "پوشه‌ای نبود"
          git push
