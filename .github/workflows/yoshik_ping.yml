name: "🚀 سامانه مدیریت و پایش یوشیک پینگ (v2.0)"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  # ========================================================
  # ۱. پردازش تست پینگ (/ping) و استخراج شناسه ربات (/bot)
  # ========================================================
  yoshik-engine:
    name: "⚙️ پردازش دستورات یوشیک پینگ"
    if: |
      github.event.issue != null && 
      (startsWith(github.event.comment.body, '/ping') || startsWith(github.event.comment.body, '/bot'))
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then
            echo "❌ خطا: دسترسی غیرمجاز."
            exit 1
          fi

      - name: "💬 ارسال پاسخ اولیه به مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            const cmd = context.payload.comment.body;
            let msg = "👋 دستور دریافت شد مدیر گرامی؛ آزمون شبکه آغاز گردید... ⏳🔬";
            if (cmd.startsWith("/bot")) {
              msg = "🛰 **دستیار تعاملی روبیکا فعال شد!**\n\n📌 ظرف **۵ دقیقه** وارد ربات روبیکا شده و `/start` را ارسال کنید تا پیام هدایت دریافت شود. ⏳";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg
            });

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4

      - name: "🐍 پیکربندی پایتون"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 نصب پکیج‌های پیش‌نیاز"
        run: |
          pip install jdatetime

      - name: "🚀 اجرای موتور یوشیک"
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHANNEL_ID }}
        run: |
          python yoshik_ping.py "${{ github.event.comment.body }}"

      - name: "💾 ثبت گزارش در مخزن (در صورت وجود)"
        if: startsWith(github.event.comment.body, '/ping')
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p ping
          git add ping/
          git commit -m "📝 ثبت گزارش خودکار: ${LOG_FILENAME:-update} [skip ci]" || echo "بدون تغییر"
          git push

      - name: "📢 ارسال نتیجه نهایی در ایشو"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('summary_comment.md')) {
              const body = fs.readFileSync('summary_comment.md', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ========================================================
  # ۲. پاکسازی مخزن
  # ========================================================
  cleanup-storage:
    name: "🧹 پاکسازی آرشیو پوشه لاگ‌ها"
    if: github.event.issue != null && contains(github.event.comment.body, 'پاکسازی')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4

      - name: "💬 تاییدیه پاکسازی از مدیر"
        id: prompt_step
        uses: actions/github-script@v7
        with:
          script: |
            const promptComment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ آیا مطمئن هستید تمام آرشیو `ping/` پاک شود؟ ظرف ۱ دقیقه با **«بله»** یا **«خیر»** پاسخ دهید."
            });
            const startTime = Date.now();
            let decision = "TIMEOUT";
            while (Date.now() - startTime < 60000) {
              await new Promise(r => setTimeout(r, 4000));
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                since: new Date(startTime).toISOString()
              });
              for (const c of comments.data) {
                if (c.user.login === context.actor && c.id !== promptComment.data.id) {
                  const t = c.body.trim();
                  if (t === "بله") { decision = "YES"; break; }
                  else if (t === "خیر") { decision = "NO"; break; }
                }
              }
              if (decision !== "TIMEOUT") break;
            }
            core.setOutput("decision", decision);

      - name: "⚙️ پردازش تصمیم"
        uses: actions/github-script@v7
        with:
          script: |
            const decision = "${{ steps.prompt_step.outputs.decision }}";
            let reply = (decision === "YES") ? "✅ پوشه ping با موفقیت حذف شد." : (decision === "NO" ? "🙏 عملیات لغو شد." : "⏰ مهلت پایان یافت.");
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: reply });

      - name: "🗑 حذف فیزیکی پوشه از گیت"
        if: steps.prompt_step.outputs.decision == 'YES'
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -rf ping/
          git add -A
          git commit -m "🧹 پاکسازی پوشه ping [skip ci]" || echo "خالی بود"
          git push
