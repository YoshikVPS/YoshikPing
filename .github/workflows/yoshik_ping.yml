name: "🚀 سامانه مدیریت و پایش یوشیک پینگ (v2.0)"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  # ========================================================
  # ۱. پردازش تست پینگ و انتشار در روبیکا
  # ========================================================
  run-ping-test:
    name: "🔍 اجرای پایش و اسکن شبکه"
    if: github.event.issue != null && startsWith(github.event.comment.body, '/ping')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then
            echo "❌ خطا: کاربر $COMMENT_USER مجاز به اجرای این دستور نیست."
            exit 1
          fi

      - name: "💬 ارسال پاسخ اولیه به مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 دستور شما دریافت شد مدیر گرامی؛ آزمون موازی شبکه نسخه 2.0 آغاز گردید... ⏳🔬"
            });

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4

      - name: "🐍 پیکربندی پایتون"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 نصب پکیج‌های پیش‌نیاز"
        run: |
          pip install jdatetime

      - name: "⚙️ پردازش دستور و پایش شبکه"
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHANNEL_ID }}
        run: |
          python yoshik_ping.py "${{ github.event.comment.body }}"

      - name: "💾 ذخیره لاگ در مخزن"
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p ping
          git add ping/
          git commit -m "📝 لاگ ارزیابی v2.0: ${LOG_FILENAME:-update} [skip ci]" || echo "بدون تغییر"
          git push

      - name: "📢 ارسال نتیجه نهایی در ایشو"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('summary_comment.md')) {
              const body = fs.readFileSync('summary_comment.md', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ========================================================
  # ۲. شکارچی و استخراج هوشمند شناسه کانال روبیکا (/bot)
  # ========================================================
  rubika-channel-finder:
    name: "🤖 استخراج شناسه کانال روبیکا"
    if: github.event.issue != null && startsWith(github.event.comment.body, '/bot')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then
            echo "❌ خطا: دسترسی غیرمجاز."
            exit 1
          fi

      - name: "💬 راهنمای فوری برای مدیر در ایشو"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🛰 **شکارچی شناسه روبیکا فعال شد!**\n\n📌 **اقدام شما:** ظرف **۵ دقیقه آینده**، یک پست از کانال موردنظرتان را به آیدی ربات روبیکا فوروارد کنید (یا ربات را در کانال ادمین کرده و یک پیام بفرستید).\n⏳ ربات منتظر دریافت پیام است..."
            });

      - name: "📥 دریافت کدها"
        uses: actions/checkout@v4

      - name: "🐍 پیکربندی پایتون"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📡 شنود پکت‌ها و استخراج chat_id"
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
        run: |
          python rubika_bot_helper.py

      - name: "📢 ارسال نتیجه استخراج شناسه در ایشو"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('bot_discovery.md')) {
              const body = fs.readFileSync('bot_discovery.md', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ========================================================
  # ۳. فرآیند پاکسازی تعاملی با تاییدیه بله/خیر
  # ========================================================
  cleanup-storage:
    name: "🧹 پاکسازی آرشیو پوشه لاگ‌ها"
    if: github.event.issue != null && contains(github.event.comment.body, 'پاکسازی')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then
            exit 1
          fi

      - name: "📥 دریافت سورس مخزن"
        uses: actions/checkout@v4

      - name: "💬 پرسش تاییدیه از مدیر"
        id: prompt_step
        uses: actions/github-script@v7
        with:
          script: |
            const promptComment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ **هشدار مدیر گرامی!**\nآیا مطمئن هستید که می‌خواهید تمام آرشیو پوشه `ping/` به‌طور کامل حذف شود؟\n\n⏱ لطفاً ظرف حداکثر **۱ دقیقه** با ارسال کلمه **«بله»** یا **«خیر»** پاسخ دهید."
            });

            const startTime = Date.now();
            let userDecision = "TIMEOUT";

            while (Date.now() - startTime < 60000) {
              await new Promise(r => setTimeout(r, 4000));
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                since: new Date(startTime).toISOString()
              });

              for (const c of comments.data) {
                if (c.user.login === context.actor && c.id !== promptComment.data.id) {
                  const txt = c.body.trim();
                  if (txt === "بله") { userDecision = "YES"; break; }
                  else if (txt === "خیر") { userDecision = "NO"; break; }
                }
              }
              if (userDecision !== "TIMEOUT") break;
            }
            core.setOutput("decision", userDecision);

      - name: "⚙️ پردازش تصمیم"
        uses: actions/github-script@v7
        with:
          script: |
            const decision = "${{ steps.prompt_step.outputs.decision }}";
            let reply = (decision === "YES") 
              ? "✅ **پوشه `ping/` با موفقیت حذف شد.**"
              : (decision === "NO" ? "🙏 عملیات لغو شد." : "⏰ مهلت به پایان رسید؛ عملیات لغو شد.");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reply
            });

      - name: "🗑 اعمال حذف فیزیکی پوشه"
        if: steps.prompt_step.outputs.decision == 'YES'
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -rf ping/
          git add -A
          git commit -m "🧹 پاکسازی آرشیو ping توسط مدیر [skip ci]" || echo "خالی بود"
          git push
