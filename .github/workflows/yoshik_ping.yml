name: "🚀 سامانه مدیریت و پایش یوشیک پینگ (v4.0)"

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  # ========================================================
  # ۱. پردازش پایش عمیق چندپورتی شبکه (/ping)
  # ========================================================
  run-deep-ping:
    name: "🔍 اجرای پایش عمیق شبکه"
    if: github.event.issue != null && startsWith(github.event.comment.body, '/ping')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 اعتبارسنجی دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then
            echo "❌ خطا: کاربر مجاز نیست."
            exit 1
          fi

      - name: "💬 ارسال پاسخ اولیه به مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "👋 دستور شما دریافت شد مدیر گرامی؛ موتور پایش عمیق **Yoshik Ping v4.0** از خارج کشور آغاز گردید... ⏳🔬"
            });

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4

      - name: "🐍 پیکربندی محیط پایتون"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 نصب پیش‌نیازها"
        run: pip install jdatetime

      - name: "⚙️ پردازش دستور و اجرای پایش"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python yoshik_ping.py "${{ github.event.comment.body }}"

      - name: "💾 ذخیره و کامیت لاگ در مخزن"
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p ping
          git add ping/
          git commit -m "📝 ثبت لاگ تحلیلی شبکه v4.0: ${LOG_FILENAME:-update} [skip ci]" || echo "بدون تغییر"
          git push

      - name: "📢 ارسال داشبورد تحلیلی در ایشو"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('summary_comment.md')) {
              const body = fs.readFileSync('summary_comment.md', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ========================================================
  # ۲. موتور تست ریزالور و تانل DNS (/dns)
  # ========================================================
  run-dns-scan:
    name: "🛡 اسکن ریزالور و تانل DNS"
    if: github.event.issue != null && startsWith(github.event.comment.body, '/dns')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 اعتبارسنجی دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4

      - name: "🐍 پیکربندی محیط پایتون"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 نصب پیش‌نیازها"
        run: pip install jdatetime

      - name: "⏱ تخمین زمان و ارسال ریپلای اولیه"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python yoshik_ping.py --dns-estimate "${{ github.event.comment.body }}"

      - name: "⚙️ اجرای اسکن موازی ریزالورها"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python yoshik_ping.py "${{ github.event.comment.body }}"

      - name: "💾 ذخیره و کامیت فایل ریزالورها در پوشه dns/"
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p dns
          git add dns/
          git commit -m "🛡 ثبت ریزالورهای سالم DNS v4.0: ${LOG_FILENAME:-update} [skip ci]" || echo "بدون تغییر"
          git push

      - name: "📢 ارسال گزارش نهایی در ایشو"
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('summary_comment.md')) {
              const body = fs.readFileSync('summary_comment.md', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ========================================================
  # ۳. موتور هوشمند بایگانی و نسخه جدید (بایگانی)
  # ========================================================
  archive-release:
    name: "📦 مدیریت بایگانی و ساخت Release"
    if: github.event.issue != null && startsWith(github.event.comment.body, 'بایگانی')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "📥 دریافت کدهای مخزن"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 پیکربندی پایتون جهت محاسبه زمان دقیق تهران"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "📦 نصب پیش‌نیاز زمان شمسی"
        run: pip install jdatetime

      - name: "🕒 محاسبه زمان دقیق تهران و اعتبارسنجی تغییر سورس"
        id: archive_check
        run: |
          python -c '
          import os, subprocess, datetime, jdatetime
          IRAN_TZ = datetime.timezone(datetime.timedelta(hours=3, minutes=30))
          now_tehran = datetime.datetime.now(datetime.timezone.utc).astimezone(IRAN_TZ)
          shamsi = jdatetime.datetime.fromgregorian(datetime=now_tehran)
          display_shamsi = shamsi.strftime("%Y/%m/%d - %H:%M:%S")
          tag_date = now_tehran.strftime("%Y%m%d-%H%M%S")
          current_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"]).decode().strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tehran_time={display_shamsi}\n")
              f.write(f"tag_timestamp={tag_date}\n")
              f.write(f"current_tree={current_tree}\n")
          '

      - name: "🔍 تطابق هوشمند با آخرین Release"
        id: evaluate_duplication
        uses: actions/github-script@v7
        with:
          script: |
            const currentTree = "${{ steps.archive_check.outputs.current_tree }}";
            try {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const tagData = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: latestRelease.data.tag_name
              });
              const releaseTree = tagData.data.commit.tree.sha;
              if (currentTree === releaseTree) {
                core.setOutput("is_duplicate", "true");
                core.setOutput("release_url", latestRelease.data.html_url);
                core.setOutput("release_name", latestRelease.data.name);
                return;
              }
            } catch (err) {}
            core.setOutput("is_duplicate", "false");

      - name: "⚠️ گزارش عدم وجود تغییر به مدیر"
        if: steps.evaluate_duplication.outputs.is_duplicate == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const relUrl = "${{ steps.evaluate_duplication.outputs.release_url }}";
            const relName = "${{ steps.evaluate_duplication.outputs.release_name }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **عملیات بایگانی متوقف گردید!**\nسورس‌کدهای پروژه تغییری نکرده‌اند و این نسخه قبلاً با مشخصات زیر ثبت شده است:\n\n📌 **عنوان نسخه:** \`${relName}\`\n🔗 [مشاهده فایل و جزئیات بایگانی در Releases](${relUrl})\n\n*(هیچ پیام جدیدی به کانال تلگرام ارسال نشد).*`
            });

      - name: "📦 فشرده‌سازی سورس و ثبت رسمی Release جدید"
        if: steps.evaluate_duplication.outputs.is_duplicate != 'true'
        id: create_rel
        env:
          GH_TOKEN: ${{ github.token }}
          TEHRAN_TIME: ${{ steps.archive_check.outputs.tehran_time }}
          TAG_TIME: ${{ steps.archive_check.outputs.tag_timestamp }}
        run: |
          TAG_NAME="v4.0-$TAG_TIME"
          TITLE="بایگانی خودکار نسخه ۴.۰ (ثبت: $TEHRAN_TIME به وقت تهران)"
          zip -r "YoshikPing-Source.zip" yoshik_ping.py .github/ README.md photo_2026-02-07_07-40-29.jpg || zip -r "YoshikPing-Source.zip" yoshik_ping.py .github/ README.md
          NOTES=$(printf "📦 بایگانی سورس رسمی پروژه یوشیک پینگ نسخه ۴.۰\n🕒 زمان ثبت تهران: %s" "$TEHRAN_TIME")
          gh release create "$TAG_NAME" "YoshikPing-Source.zip" --title "$TITLE" --notes "$NOTES"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "rel_title=$TITLE" >> $GITHUB_OUTPUT
          echo "rel_url=https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME" >> $GITHUB_OUTPUT

      - name: "📢 اطلاع‌رسانی انتشار در کانال تلگرام"
        if: steps.evaluate_duplication.outputs.is_duplicate != 'true' && contains(github.event.comment.body, '@YoshikVPSBOT')
        id: tg_announce
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          REL_URL: ${{ steps.create_rel.outputs.rel_url }}
          TAG_NAME: ${{ steps.create_rel.outputs.tag_name }}
          TEHRAN_TIME: ${{ steps.archive_check.outputs.tehran_time }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            TEXT=$(printf "🚀 <b>انتشار و بایگانی رسمی سورس سامانه Yoshik Ping v4.0</b>\n\n📦 <b>شناسه تگ:</b> <code>%s</code>\n📅 <b>زمان ثبت رسمی:</b> <code>%s</code> (تهران)\n🛠 سورس جامع پروژه به همراه اتوماسیون کامل Actions فشرده و ذخیره شد.\n\n🔗 <a href=\"%s\">دریافت مستقیم فایل سورس از گیت‌هاب</a>\n📢 کانال تخصصی: @YoshikVPS" "$TAG_NAME" "$TEHRAN_TIME" "$REL_URL")
            RESP=$(curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHANNEL_ID" \
              --data-urlencode "text=$TEXT" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=true")
            MSG_ID=$(echo $RESP | jq -r '.result.message_id // empty')
            if [ -n "$MSG_ID" ]; then
              CLEAN_CH=$(echo "$TELEGRAM_CHANNEL_ID" | sed 's/@//')
              echo "tg_link=https://t.me/$CLEAN_CH/$MSG_ID" >> $GITHUB_OUTPUT
            fi
          fi

      - name: "💬 گزارش تکمیل بایگانی در ایشو"
        if: steps.evaluate_duplication.outputs.is_duplicate != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const relUrl = "${{ steps.create_rel.outputs.rel_url }}";
            const relTitle = "${{ steps.create_rel.outputs.rel_title }}";
            const tehranTime = "${{ steps.archive_check.outputs.tehran_time }}";
            const tgLink = "${{ steps.tg_announce.outputs.tg_link }}";
            let msg = `✅ **سورس نسخه جدید با موفقیت بایگانی گردید.**\n\n📌 **عنوان ثبت‌شده:** \`${relTitle}\`\n🕒 **زمان دقیق (تهران):** \`${tehranTime}\`\n📦 **لینک بایگانی و دانلود:** [مشاهده Release در گیت‌هاب](${relUrl})\n`;
            if (tgLink) {
              msg += `📢 **لینک پست کانال:** [مشاهده اطلاعیه در کانال تلگرام](${tgLink})\n`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg
            });

  # ========================================================
  # ۴. پاکسازی سوابق و تاریخچه تب Actions (اکشنز-پاک)
  # ========================================================
  cleanup-actions-history:
    name: "🧹 پاکسازی تاریخچه اجراهای اکشنز"
    if: github.event.issue != null && contains(github.event.comment.body, 'اکشنز-پاک')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "🗑 حذف تمامی سوابق اجراهای قبلی و پاکسازی"
        uses: actions/github-script@v7
        with:
          script: |
            const currentRunId = context.runId;
            let deletedCount = 0;
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id !== currentRunId) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                  deletedCount++;
                } catch (e) {}
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🧹 **پاکسازی تب Actions انجام شد.**\nتعداد **${deletedCount}** اجرای قبلی با موفقیت حذف گردید و تاریخچه به طور کامل خلوت شد. ✅`
            });
            try {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: currentRunId
              });
            } catch (e) {}

  # ========================================================
  # ۵. پاکسازی دو مرحله‌ای پوشه لاگ‌ها (پاکسازی)
  # ========================================================
  cleanup-storage:
    name: "🧹 پاکسازی آرشیو پوشه‌های لاگ"
    if: github.event.issue != null && contains(github.event.comment.body, 'پاکسازی')
    runs-on: ubuntu-latest

    steps:
      - name: "🔒 بررسی سطح دسترسی مدیر"
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USERNAME }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ -n "$ADMIN_USER" ] && [ "$COMMENT_USER" != "$ADMIN_USER" ]; then exit 1; fi

      - name: "📥 دریافت سورس مخزن"
        uses: actions/checkout@v4

      - name: "💬 تاییدیه پاکسازی از مدیر"
        id: prompt_step
        uses: actions/github-script@v7
        with:
          script: |
            const promptComment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ آیا مطمئن هستید که تمام آرشیو پوشه‌های `ping/` و `dns/` حذف شود؟ ظرف ۱ دقیقه با **«بله»** یا **«خیر»** پاسخ دهید."
            });
            const startTime = Date.now();
            let decision = "TIMEOUT";
            while (Date.now() - startTime < 60000) {
              await new Promise(r => setTimeout(r, 4000));
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                since: new Date(startTime).toISOString()
              });
              for (const c of comments.data) {
                if (c.user.login === context.actor && c.id !== promptComment.data.id) {
                  const t = c.body.trim();
                  if (t === "بله") { decision = "YES"; break; }
                  else if (t === "خیر") { decision = "NO"; break; }
                }
              }
              if (decision !== "TIMEOUT") break;
            }
            core.setOutput("decision", decision);

      - name: "⚙️ پردازش تصمیم مدیر"
        uses: actions/github-script@v7
        with:
          script: |
            const decision = "${{ steps.prompt_step.outputs.decision }}";
            let reply = (decision === "YES") ? "✅ پوشه‌های `ping/` و `dns/` با موفقیت پاکسازی شدند." : (decision === "NO" ? "🙏 عملیات لغو شد." : "⏰ مهلت به پایان رسید؛ عملیات متوقف شد.");
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: reply });

      - name: "🗑 اعمال حذف فیزیکی پوشه‌ها"
        if: steps.prompt_step.outputs.decision == 'YES'
        run: |
          git config --global user.name "Yoshik Ping Engine"
          git config --global user.email "ping-engine@users.noreply.github.com"
          git pull --rebase origin main || true
          rm -rf ping/ dns/
          git add -A
          git commit -m "🧹 پاکسازی پوشه‌های ping و dns توسط مدیر [skip ci]" || echo "پوشه‌ای نبود"
          git push
